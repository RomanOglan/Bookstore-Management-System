{% extends "base.html" %}{% block title %}{{ 'Edit' if book else 'Add' }} book{% endblock %}{% block content %}<div class="panel"><h1>{{ 'Edit' if book else 'Add' }} book</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" maxlength="255" value="{{ book.Title if book else '' }}" required></label><label>ISBN (10 or 13 digits)<input name="isbn" maxlength="13" value="{{ book.ISBN or '' if book else '' }}"></label><label>Description<textarea name="description" maxlength="1000">{{ book.Description or '' if book else '' }}</textarea></label><div class="form-row"><label>Price<input type="number" name="price" min="0" step="0.01" value="{{ book.Price if book else '' }}" required></label><label>Sale quantity (blank if unknown)<input type="number" name="quantity" min="0" value="{{ book.Quantity if book and book.Quantity is not none else '' }}"></label></div><label>Category<select name="category_id" required>{% for category in categories %}<option value="{{ category.CategoryID }}" {% if book and book.CategoryID == category.CategoryID %}selected{% endif %}>{{ category.CategoryName }}</option>{% endfor %}</select></label><button>Save</button></form>{% if book %}<hr><form method="post" action="{{ url_for('delete_book', book_id=book.BookID) }}" onsubmit="return confirm('Delete this unreferenced book?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger">Delete book</button></form>{% endif %}</div>{% endblock %}
